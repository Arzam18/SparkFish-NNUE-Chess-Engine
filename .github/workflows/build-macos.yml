name: Build SparkFish 4.0 macOS

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download SparkfishV4.nnue
        run: |
          curl -fL -o SparkfishV4.nnue "https://github.com/Lester-chess/Sparkfish-NNUE-Pack/releases/download/v5/SparkfishV4.nnue"

      - name: Build macOS Apple Silicon (arm64) & Intel (x86_64 AVX2)
        run: |
          clang++ -std=c++20 -O3 -DNDEBUG -arch arm64 -DSPARKFISH_EMBED_NNUE -pthread main.cpp -o sparkfish-4.0-macos-arm64
          clang++ -std=c++20 -O3 -DNDEBUG -arch x86_64 -mavx2 -mbmi2 -mpopcnt -DSPARKFISH_EMBED_NNUE -pthread main.cpp -o sparkfish-4.0-macos-x86_64-avx2

      - name: Verify embedded NNUE (Apple Silicon)
        run: |
          rm -f SparkfishV4.nnue
          printf "uci\nisready\nquit\n" | ./sparkfish-4.0-macos-arm64 | grep -E "SparkFish|NNUE|readyok"
          ./sparkfish-4.0-macos-arm64 --self-test

      - name: Upload macOS binaries
        uses: actions/upload-artifact@v4
        with:
          name: SparkFish-4.0-macOS
          path: sparkfish-4.0-macos-*
